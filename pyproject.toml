[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abca-parquet-superconductivity"
version = "0.1.0"
description = "Single-point free-band cRPA, particle-hole parquet, and intravalley pairing in ABCA graphene"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.14", "matplotlib>=3.8", "threadpoolctl>=3.1"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "ipykernel>=6", "nbformat>=5.9"]
test = ["pytest>=8", "nbclient>=0.9", "nbformat>=5.9", "ipykernel>=6"]

[project.scripts]
abca-sc = "parquet_superconductivity.run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["parquet_superconductivity*", "free_fermion_gamma*", "static_parquet_memory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
